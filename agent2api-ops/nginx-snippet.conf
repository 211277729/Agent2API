# Agent2API 网关反代片段（放进现有站点 server{} 里）
#
# 关键点：这是 SSE 流式接口，必须关缓冲，否则回复会攒到最后一次性吐出。
location /v1/ {
    proxy_pass http://127.0.0.1:3065;
    proxy_http_version 1.1;

    proxy_buffering off;          # SSE 必需
    proxy_cache off;
    proxy_request_buffering off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://127.0.0.1:3065/health;
    access_log off;
}

# 面板（:3066）不要在这里开 location —— 管理面走 SSH 隧道：
#   ssh -L 3066:127.0.0.1:3066 root@<服务器IP>
#   浏览器打开 http://127.0.0.1:3066
